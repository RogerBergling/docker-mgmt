name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # Pinned to immutable commit SHAs; keep the version comment beside each.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python3 -m compileall -q docker_mgmt tests

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Optional static checks (only when already installed)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check docker_mgmt tests
          fi
          if command -v bandit >/dev/null 2>&1; then
            bandit -q -r docker_mgmt
          fi
