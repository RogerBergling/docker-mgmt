# docker-mgmt configuration example.
#
# Copy to /etc/docker-mgmt/config.ini (root) or
# ~/.config/docker-mgmt/config.ini (non-root) and edit.
#
# If running as root, the config file must be owned by root and must not be
# group- or world-writable. If running as a non-root user with Docker access,
# the config must be owned by you or root and must not be group/world-writable.
# This prevents another local user from redirecting this Docker-privileged tool.

[scan]
# Directories searched recursively for Compose/YAML files.
roots = /opt, /srv, /var/www, /home, /root

# When false, only files whose name contains "compose" (plus the standard
# compose.yaml/docker-compose.yaml names) are considered. When true, every
# *.yml/*.yaml file is checked with `docker compose config`.
include_all_yaml = false

# Maximum directory depth below each root. 1 means only the root itself.
max_depth = 8

# Hidden directories are useful to skip (.git, .cache, etc.).
include_hidden = false

# Do not follow directory symlinks. File symlinks are resolved and must remain
# inside one of the scan roots.
follow_symlinks = false

# Additional directory names to skip. The built-in safety exclusions
# (.git, node_modules, /proc, /sys, /var/lib/docker, ...) always apply.
exclude_dirs = .cache, .npm, .cargo, .rustup, .gradle, .m2, snap

[compose]
# Timeouts in seconds.
command_timeout_seconds = 120
pull_timeout_seconds = 900
up_timeout_seconds = 300

# If true, add --wait --wait-timeout to `compose up -d`. This requires a
# Compose version that supports it and can make updates fail if a service is
# unhealthy. Health is always shown in the dashboard.
wait_after_update = false
wait_timeout_seconds = 120

[audit]
# Omit to use /var/log/docker-mgmt/audit.log as root, or the XDG state
# directory as a normal user.
# path = /var/log/docker-mgmt/audit.log
max_bytes = 10485760

[ui]
# auto, always, or never. NO_COLOR in the environment always wins.
color = auto
page_size = 20

[security]
# DANGEROUS. When false (recommended), mutating Compose actions are blocked
# when a Compose file, .env file, or build context is not owned by root or the
# current user, or is group/world-writable. Keep this false on production
# servers.
allow_unsafe_ownership = false

# DANGEROUS. Compose `include` and service `extends` can reference YAML files
# that the static trust check cannot enumerate. When false (recommended),
# mutating actions are blocked for such projects. Set to true only after
# reviewing and locking down every referenced file.
allow_unverified_references = false
