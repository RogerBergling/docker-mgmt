[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-mgmt"
version = "0.1.0"
description = "Menu-driven, audited management of local Docker Compose projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
docker-mgmt = "docker_mgmt.cli:main"

[tool.setuptools.packages.find]
include = ["docker_mgmt*"]
